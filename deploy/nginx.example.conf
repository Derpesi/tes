# CONTOH reverse proxy (TLS di sini). Sesuaikan server_name dan sertifikat. Bukan konfigurasi final.
limit_req_zone $binary_remote_addr zone=umum:10m rate=20r/s;

server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;
  ssl_certificate     /etc/nginx/tls/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  server_tokens off;

  # Selfie JPEG <= 300 KB + bidang formulir; dokumen kontrak PDF lebih besar. Batas aplikasi tetap berlaku (defense in depth).
  client_max_body_size 12m;
  client_body_timeout 30s;
  proxy_read_timeout 60s;

  location / {
    limit_req zone=umum burst=60 nodelay;
    proxy_pass http://web:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
  }
  # Endpoint kesehatan API tidak dipublikasikan ke internet.
  location = /api/health { return 404; }
  location = /api/ready  { return 404; }
}
